[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stmrr"
version = "0.1.0.dev0"
description = "Star Trek Retro Remake — a turn-based, grid-based PySide6 strategy game inspired by Super Star Trek (1973) and 1990s desktop strategy titles."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "Chris Purcell" },
]
keywords = [
    "game",
    "strategy",
    "turn-based",
    "star-trek",
    "pyside6",
    "qt",
    "linux",
    "fan-game",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]
dependencies = [
    "PySide6>=6.5",
    "pydantic>=2.0",
    "tcod>=21.0",
    "blinker>=1.8",
    "loguru>=0.7",
    "qtawesome>=1.4",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/chrisdpurcell/star-trek-retro-remake"
Issues = "https://github.com/chrisdpurcell/star-trek-retro-remake/issues"
Changelog = "https://github.com/chrisdpurcell/star-trek-retro-remake/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/stmrr"]

# Pytest: headless Qt configured here so `uv run pytest` works without
# a wrapper script. See DESIGN.md §10.3 "Headless Qt".
[tool.pytest.ini_options]
env = [
    "QT_QPA_PLATFORM=offscreen",
]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = []
minversion = "9.0"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "basedpyright",
    "coverage[toml]",
    "pip-audit",
    "pytest>=9.0",
    "ruff>=0.14.11",
    "pytest-qt>=4.4",
    "pytest-mock>=3.12",
    "pytest-env>=1.1",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[tool.basedpyright]
failOnWarnings = true
include = ["src", "tests", "scripts"]
pythonPlatform = "All"
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.coverage.run]
branch = true
source = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".claude", ".agents", ".codex", ".continue", ".venv", "build", "dist"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PTH", "RET", "RUF"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
