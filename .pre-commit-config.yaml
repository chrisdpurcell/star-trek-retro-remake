# Targeted local hygiene and layer checks. The complete gate is
# `uv run python scripts/check.py`; CI runs that same script.
#
# After `uv sync --locked --all-groups`, run
# `uv run pre-commit run --all-files` directly. Do not install hooks.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/seddonym/import-linter
    rev: v2.11
    hooks:
      - id: import-linter
