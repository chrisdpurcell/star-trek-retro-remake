name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a newer commit lands on the same ref —
# saves runner minutes during rebases / force-pushes on feature branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Keep this legacy display name until the protected-main ruleset is updated
    # in a separately authorized GitHub administration change.
    name: ruff + mypy + import-linter + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Headless Qt for pytest-qt and any QImage snapshot tests
      # (DESIGN.md §10.3). pytest-env reads the same value from
      # pyproject.toml, but we set it at the workflow level too in
      # case anything imports Qt before pytest configures the env.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv with cache
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync project (locked, all groups)
        run: uv sync --locked --all-groups

      - name: Install xvfb (fallback for tests that need a real display)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
              libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Python verification gate
        run: uv run python scripts/check.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            .coverage
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
